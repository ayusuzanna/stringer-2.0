<svg viewBox="0 0 540 185" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NSTP a media prima company">
  <!-- Outer rounded border -->
  <rect x="6" y="6" width="104" height="116" rx="10" fill="#FFFFFF" stroke="#F5921E" stroke-width="5" />
  <!-- Orange pen nib housing -->
  <rect x="12" y="12" width="92" height="104" rx="6" fill="#F5921E" />
  <!-- Fountain pen nib white silhouette -->
  <path d="M 58 110 L 52 110 C 50 85 36 68 34 38 L 34 16 L 58 16 Z" fill="#FFFFFF" />
  <path d="M 58 110 L 64 110 C 66 85 80 68 82 38 L 82 16 L 58 16 Z" fill="#FFFFFF" />
  <!-- Nib center slit and circular breather hole in orange -->
  <rect x="56.5" y="66" width="3" height="44" fill="#F5921E" />
  <circle cx="58" cy="62" r="4.5" fill="#F5921E" />
  <!-- NSTP Wordmark -->
  <text x="132" y="108" font-family="'Plus Jakarta Sans', Arial, -apple-system, sans-serif" font-weight="900" font-size="112" letter-spacing="-3px" fill="#000000">NSTP</text>
  <!-- Horizontal Orange Divider Line -->
  <line x1="6" y1="134" x2="534" y2="134" stroke="#F5921E" stroke-width="5" stroke-linecap="square" />
  <!-- Sub-Brand Tagline: "a [media] prima company" -->
  <text x="248" y="173" font-family="'Plus Jakarta Sans', Arial, -apple-system, sans-serif" font-weight="500" font-size="28" fill="#000000">a</text>
  <rect x="274" y="146" width="92" height="38" fill="#E60000" />
  <text x="320" y="173" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, -apple-system, sans-serif" font-weight="800" font-size="24" letter-spacing="-0.5px" fill="#FFFFFF">media</text>
  <text x="378" y="173" font-family="'Plus Jakarta Sans', Arial, -apple-system, sans-serif" font-weight="800" font-size="28" letter-spacing="-0.5px" fill="#000000">prima</text>
  <text x="454" y="173" font-family="'Plus Jakarta Sans', Arial, -apple-system, sans-serif" font-weight="400" font-size="28" letter-spacing="-0.3px" fill="#000000">company</text>
</svg>
